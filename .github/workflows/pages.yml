name: Pages

# gentropic.org/golem/ (the org's custom domain over gentropic.github.io/golem): the committed build, as it is.
# dist/ is committed with the source change that produced it, so nothing is built here; only what a visitor loads
# is published (the folder's index, the page, the worker, the manifest, the icons).

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: The served files
        run: |
          mkdir _site
          cp dist/index.html dist/golem.html dist/sw.js dist/manifest.webmanifest dist/icon.svg dist/icon-192.png dist/icon-512.png dist/icon-maskable-512.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
